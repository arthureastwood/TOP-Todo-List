<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
</head>
<body>
    <div id="app-container">
        <aside class="sidebar">
            <h2>Projects</h2>
            <ul id="project-list"></ul>
            <button id="new-project-btn">New Project</button>
        </aside>

        <main class="main-content">
            <h2 id="current-project-title">Default</h2>
            <button id="new-todo-btn">New Todo</button>
            <ul id="todo-list"></ul>
        </main>
    </div>

    <!-- Modals and dialogs -->
    <dialog id="new-project-dialog-container" class="hidden">
        <form id="add-project-form">
            <label for="project-title-input">Project Title:</label>
            <input type="text" id="new-project-title" placeholder="New Project Title" required>
            <div class="new-project-controls">
                <button id="add-project-btn" type="button">Add</button>
                <button id="cancel-project-btn" type="button">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog id="todo-modal" class="hidden">
        <form id="add-todo-form">
            <input type="text" name="todo-title" id="todo-title-input" placeholder="Task Title" required>
            <textarea name="todo-description" id="todo-description-input" placeholder="Description"></textarea>
            <input type="date" name="todo-date" id="todo-date-input" required>
            <select name="todo-priority" id="todo-priority-input">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>
            <textarea name="todo-notes" id="todo-notes-input" placeholder="Notes"></textarea>
            <button id="add-todo-btn" type="submit">Save Task</button>
        </form>
        <button id="close-todo-dialog" type="button">x</button>
    </dialog>

    <div id="todo-details-modal" class="hidden">
        <h2 id="details-title"></h2>
        <p><strong>Description:</strong> <span id="details-description"></span></p>
        <p><strong>Due Date:</strong> <span id="details-dueDate"></span></p>
        <p><strong>Priority:</strong> <span id="details-priority"></span></p>
        <p><strong>Notes:</strong> <span id="details-notes"></span></p>
        <button id="edit-todo-btn" type="button">Edit</button>
        <button id="delete-todo-btn" type="button">Delete</button>
        <button id="close-details-btn">x</button>
    </div>
</body>
</html>
